pull_request_rules:
  - name: controlled update first um47
    conditions:
      - label = h1-workflow-update-merge-um47
      - "#commits-behind > 0"
      - -closed
    actions:
      update:
  - name: controlled merge from same old state um47
    conditions:
      - label = h1-workflow-update-merge-um47
      - check-success = H1_UPDATE_MERGE_GUARD_um47
      - -closed
    actions:
      merge:
        method: squash