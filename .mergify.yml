pull_request_rules:
  - name: controlled update first um48
    conditions:
      - label = h1-workflow-update-merge-um48
      - "#commits-behind > 0"
      - -closed
    actions:
      update:
  - name: controlled merge from same old state um48
    conditions:
      - label = h1-workflow-update-merge-um48
      - check-success = H1_UPDATE_MERGE_GUARD_um48
      - -closed
    actions:
      merge:
        method: squash